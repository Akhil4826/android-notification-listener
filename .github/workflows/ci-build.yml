name: CI/CD - Build, Test & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. Test Voice & Backend Services (Alexa Skill & Cloudflare)
  # -----------------------------------------------------------
  test-services:
    name: Test Alexa Skill & Cloudflare Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            alexa/package.json
            cloudflare/package.json

      - name: Test Alexa Skill (63 Tests)
        run: |
          cd alexa
          npm ci || npm install
          npm test

      - name: Test Cloudflare Worker Engine (29 Tests)
        run: |
          cd cloudflare
          npm ci || npm install
          npm test

  # -----------------------------------------------------------
  # 2. Build Android App & Generate Downloadable APK
  # -----------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-services
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/MobileReader.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileReader-APK
          path: release-apk/MobileReader.apk
          retention-days: 90

      - name: Create GitHub Release (On Tag Push or Manual Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/MobileReader.apk
          name: Mobile Reader Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
